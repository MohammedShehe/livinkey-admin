<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Livinkey · Admin</title>
<link rel="icon" href="assets/img/black_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css?v=2" rel="stylesheet">
<style>
.notice-card{border:1px solid var(--border,#e8e8e8);border-radius:16px;overflow:hidden;background:var(--card,#fff);height:100%}
.notice-img-wrap{height:260px;background:#f5f6f7;display:flex;align-items:center;justify-content:center;overflow:hidden}
.notice-img-wrap img{width:100%;height:100%;object-fit:cover}
.notice-empty{color:#8b929a;text-align:center}
.notice-actions{padding:12px;display:flex;gap:8px;justify-content:space-between}
.upload-zone{border:1.5px dashed #cfd5dc;border-radius:16px;padding:22px;background:#fafbfc}
</style>
</head>
<body>
<div id="sidebarMount"></div>
<div class="main-area">
  <div id="topbarMount"></div>
  <main class="container-fluid px-3 px-lg-4 py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
      <div>
        <div class="step-eyebrow">Company details</div>
        <h1 class="h3 mb-1">About Livinkey</h1>
        <p class="text-muted-soft mb-0">Manage notices shown exclusively to Livinkey tenants.</p>
      </div>
    </div>

    <section class="card border-0 shadow-sm rounded-4 p-3 p-lg-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
          <h2 class="h5 mb-1"><i class="bi bi-megaphone-fill me-2"></i>Notices</h2>
          <p class="text-muted-soft small mb-0">Upload up to 5 notice images. Guests cannot access these notices.</p>
        </div>
        <span class="badge text-bg-light border" id="noticeCount">0 / 5</span>
      </div>

      <div class="upload-zone mb-4">
        <div class="row align-items-center g-3">
          <div class="col">
            <strong>Attach Livinkey notices</strong>
            <div class="small text-muted-soft">Images only · maximum 5 active notices · up to 5 MB each.</div>
          </div>
          <div class="col-auto">
            <input type="file" id="noticeFiles" class="d-none" accept="image/*" multiple>
            <button class="btn btn-brand" id="chooseNotices"><i class="bi bi-image me-1"></i>Select Images</button>
          </div>
        </div>
        <div class="small mt-2 d-none" id="selectedFiles"></div>
        <button class="btn btn-success btn-sm mt-3 d-none" id="uploadBtn"><i class="bi bi-cloud-arrow-up me-1"></i>Upload Selected</button>
      </div>

      <div id="noticeAlert"></div>
      <div class="row g-3" id="noticeGrid">
        <div class="col-12 text-center py-5 text-muted-soft">Loading notices…</div>
      </div>
    </section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/about-livinkey.js"></script>
</body>
</html>
