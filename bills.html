<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bills · Livinkey Admin</title>
<link rel="icon" href="assets/img/white_logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div id="topbarMount"></div>
    <main class="content-area">
      <div class="row g-3 mb-4" id="billStats"></div>

      <div class="section-card fade-in">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
          <div class="d-flex gap-2 flex-wrap" id="billTabs"></div>
          <button class="btn-fab" title="Create a bill" data-bs-toggle="modal" data-bs-target="#createBillModal"><i class="bi bi-plus-lg"></i></button>
        </div>
        <div id="billTableWrap" class="table-responsive"></div>
        <div id="billEmpty" class="empty-state d-none">
          <i class="bi bi-receipt"></i>
          <p class="mb-0 fw-semibold">Nothing to show here right now</p>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Generic tenant detail / message modal -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="detailName"></h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="detailBody"></div>
        <div id="detailMessageWrap" class="mt-3">
          <label class="form-label">Message to tenant</label>
          <textarea class="form-control" id="detailMessage" rows="5"></textarea>
          <div class="mt-2 d-flex gap-2">
            <button class="btn btn-outline-brand btn-sm" id="attachBtn"><i class="bi bi-paperclip me-1"></i>Attach</button>
            <button class="btn btn-outline-brand btn-sm" id="qrBtn"><i class="bi bi-qr-code me-1"></i>Generate QR Code</button>
          </div>
          <input type="file" id="attachInput" class="d-none" accept="image/*">
        </div>
      </div>
      <div class="modal-footer" id="detailFooter"></div>
    </div>
  </div>
</div>

<!-- Cash payment modal -->
<div class="modal fade" id="cashModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Record Cash Payment</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="cashForm">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Tenant</label>
            <select class="form-select" id="cashTenant" required></select>
          </div>
          <div class="row g-3">
            <div class="col-6"><label class="form-label">From date</label><input type="date" class="form-control" id="cashFrom" required></div>
            <div class="col-6"><label class="form-label">Till date</label><input type="date" class="form-control" id="cashTill" required></div>
          </div>
          <div class="mt-3"><label class="form-label">Amount (INR)</label><input type="number" class="form-control" id="cashAmount" required></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-brand" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand">Confirm payment</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Cash OTP modal -->
<div class="modal fade" id="cashOtpModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">
      <div class="modal-body py-4">
        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:56px;height:56px;border-radius:16px;background:var(--lk-green-100);">
          <i class="bi bi-shield-check" style="font-size:1.4rem;color:var(--lk-green-darker);"></i>
        </div>
        <h5>Verify OTP</h5>
        <p class="text-muted-soft small">An OTP was sent to <strong id="cashOtpTenant"></strong> to confirm this cash collection.</p>
        <div class="d-flex justify-content-center gap-2 my-3">
          <input type="text" maxlength="1" class="input-otp cash-otp-box" style="width:44px;height:52px;font-size:1.2rem;">
          <input type="text" maxlength="1" class="input-otp cash-otp-box" style="width:44px;height:52px;font-size:1.2rem;">
          <input type="text" maxlength="1" class="input-otp cash-otp-box" style="width:44px;height:52px;font-size:1.2rem;">
          <input type="text" maxlength="1" class="input-otp cash-otp-box" style="width:44px;height:52px;font-size:1.2rem;">
        </div>
        <button class="btn btn-brand w-100" id="verifyCashOtpBtn">Verify &amp; collect cash</button>
      </div>
    </div>
  </div>
</div>

<!-- Create bill modal - UPDATED with attachment and QR -->
<div class="modal fade" id="createBillModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create a Bill</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="createBillForm">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Tenant (unpaid)</label>
            <select class="form-select" id="billTenant" required></select>
          </div>
          <div class="row g-3">
            <div class="col-6"><label class="form-label">Rent (INR)</label><input type="number" class="form-control" id="billRent" required></div>
            <div class="col-6"><label class="form-label">Electricity bill (INR)</label><input type="number" class="form-control" id="billElectricity" value="0"></div>
            <div class="col-6"><label class="form-label">Maintenance fee (INR)</label><input type="number" class="form-control" id="billMaintenance" value="0"></div>
            <div class="col-6"><label class="form-label">Other charges (INR)</label><input type="number" class="form-control" id="billOther" value="0"></div>
            <div class="col-12"><hr></div>
            <div class="col-12"><label class="form-label fw-bold">Total Amount: <span id="billTotalDisplay">₹0</span></label></div>
          </div>
          
          <!-- Attachment and QR Section -->
          <div class="mt-3 pt-3 border-top">
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label">Attach file (optional)</label>
                <div class="d-flex gap-2">
                  <button type="button" class="btn btn-outline-brand btn-sm" id="billAttachBtn">
                    <i class="bi bi-paperclip me-1"></i>Attach
                  </button>
                  <span class="text-muted-soft small d-flex align-items-center" id="billAttachmentStatus">No file attached</span>
                </div>
                <input type="file" id="billAttachInput" class="d-none" accept="image/*,.pdf,.doc,.docx">
              </div>
              <div class="col-12 mt-2">
                <label class="form-label">Generate Payment QR Code</label>
                <div class="d-flex gap-2 flex-wrap align-items-center">
                  <button type="button" class="btn btn-dark-brand btn-sm" id="billGenerateQRBtn">
                    <i class="bi bi-qr-code me-1"></i>Generate & Send QR
                  </button>
                  <span class="text-muted-soft small d-flex align-items-center" id="billQRStatus">No QR generated</span>
                </div>
                <small class="text-muted-soft d-block mt-1">QR code will be sent with the bill for easy payment</small>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-brand" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand"><i class="bi bi-send me-1"></i>Send bill</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/bills.js"></script>
</body>
</html>
