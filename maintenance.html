<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance · Livinkey Admin</title>
<link rel="icon" href="assets/img/black_logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<style>
  .status-badge {
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    display: inline-block;
  }
  .status-pending {
    background: #fff3cd;
    color: #856404;
  }
  .status-inprogress {
    background: #cce5ff;
    color: #004085;
  }
  .status-completed {
    background: #d4edda;
    color: #155724;
  }
  .btn-status {
    padding: 0.2rem 0.5rem;
    font-size: 0.7rem;
    border-radius: 4px;
    border: none;
    transition: 0.15s;
  }
  .btn-status:hover {
    transform: scale(1.05);
  }
  .btn-status-pending {
    background: #ffc107;
    color: #000;
  }
  .btn-status-pending:hover {
    background: #e0a800;
  }
  .btn-status-inprogress {
    background: #0d6efd;
    color: #fff;
  }
  .btn-status-inprogress:hover {
    background: #0b5ed7;
  }
  .btn-status-completed {
    background: #198754;
    color: #fff;
  }
  .btn-status-completed:hover {
    background: #157347;
  }
  .btn-status-disabled {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div id="topbarMount"></div>
    <main class="content-area">
      <div class="section-card fade-in">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
          <div>
            <h5 class="mb-0">Maintenance Requests</h5>
            <p class="text-muted-soft small mb-0">All tenant maintenance queries in one place.</p>
          </div>
          <div class="table-search">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control" style="width:260px;" id="maintenanceSearch" placeholder="Search by room, name or type">
          </div>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Room No</th>
                <th>Name</th>
                <th>Email</th>
                <th>Type</th>
                <th>Service Date</th>
                <th>Free Time</th>
                <th>Description</th>
                <th>Picture</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="maintenanceTbody"></tbody>
          </table>
        </div>
        <div id="maintenanceEmpty" class="empty-state d-none">
          <i class="bi bi-tools"></i>
          <p class="mb-0 fw-semibold">No maintenance requests found</p>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Image Preview Modal -->
<div class="modal fade" id="imagePreviewModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Maintenance Image</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <img id="previewImage" src="" alt="Maintenance" class="img-fluid" style="max-height:500px;">
        <div class="mt-3">
          <button class="btn btn-brand" id="downloadImageBtn"><i class="bi bi-download me-1"></i>Download</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:56px;height:56px;border-radius:50%;background:var(--danger-bg);">
          <i class="bi bi-exclamation-triangle" style="font-size:1.4rem;color:var(--danger);"></i>
        </div>
        <h5 id="confirmTitle">Delete this request?</h5>
        <p class="text-muted-soft" id="confirmBody">This maintenance request will be permanently removed.</p>
        <div class="d-flex justify-content-center gap-2 mt-3">
          <button class="btn btn-outline-brand px-4" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-soft-danger px-4" id="confirmActionBtn">Yes, delete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/maintenance.js"></script>
</body>
</html>
