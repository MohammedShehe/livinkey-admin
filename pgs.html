<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGs Management · Livinkey Admin</title>
<link rel="icon" href="assets/img/white_logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div id="topbarMount"></div>
    <main class="content-area">
      <div class="row g-3 mb-4" id="pgStats"></div>

      <div class="section-card fade-in">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
          <div>
            <h5 class="mb-0">All PGs</h5>
            <p class="text-muted-soft small mb-0">Manage all PG properties in your portfolio.</p>
          </div>
          <div class="d-flex align-items-center gap-2">
            <div class="table-search">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" style="width:220px;" id="pgSearch" placeholder="Search by name or location">
            </div>
            <button class="btn-fab" data-bs-toggle="modal" data-bs-target="#addPgModal" title="Add PG"><i class="bi bi-plus-lg"></i></button>
          </div>
        </div>
        <div class="row g-3" id="pgsGrid"></div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit PG Modal -->
<div class="modal fade" id="addPgModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="pgModalTitle">Add PG</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="pgForm">
        <div class="modal-body">
          <input type="hidden" id="pgId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">PG Name</label>
              <input class="form-control" id="pName" required placeholder="e.g. Alishan PG">
            </div>
            <div class="col-md-6">
              <label class="form-label">Location</label>
              <input class="form-control" id="pLocation" required placeholder="Full address">
            </div>
            <div class="col-md-4">
              <label class="form-label">Number of Floors</label>
              <input type="number" class="form-control" id="pFloors" required min="1">
            </div>
            <div class="col-md-4">
              <label class="form-label">Rooms per Floor</label>
              <input type="number" class="form-control" id="pRoomsPerFloor" required min="1">
            </div>
            <div class="col-md-4">
              <label class="form-label">Capacity per Room</label>
              <input type="number" class="form-control" id="pCapacity" required min="1">
            </div>
          </div>
          <hr>
          <div id="pgRoomDetails">
            <p class="text-muted-soft small">Room details will be auto-generated based on floors and rooms per floor.</p>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-brand" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand">Save PG</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- PG Detail Modal -->
<div class="modal fade" id="pgDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="pgDetailName"></h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="pgDetailBody"></div>
    </div>
  </div>
</div>

<!-- Delete confirm -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:56px;height:56px;border-radius:50%;background:var(--danger-bg);">
          <i class="bi bi-exclamation-triangle" style="font-size:1.4rem;color:var(--danger);"></i>
        </div>
        <h5 id="confirmTitle">Delete this PG?</h5>
        <p class="text-muted-soft" id="confirmBody">This action cannot be undone.</p>
        <div class="d-flex justify-content-center gap-2 mt-3">
          <button class="btn btn-outline-brand px-4" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-soft-danger px-4" id="confirmActionBtn">Yes, delete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/pgs.js"></script>
</body>
</html>
