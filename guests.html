<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guests · Livinkey Admin</title>
<link rel="icon" href="assets/img/black_logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div id="topbarMount"></div>
    <main class="content-area">
      <div class="row g-3 mb-4" id="guestStats"></div>

      <div class="section-card mb-4 fade-in">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h6 class="mb-0"><i class="bi bi-stars text-success me-2"></i>New Guests</h6>
          <span class="small text-muted-soft">Joined in the last 14 days</span>
        </div>
        <div class="d-flex flex-wrap gap-2" id="newGuestsRow"></div>
      </div>

      <div class="section-card fade-in">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
          <div>
            <h5 class="mb-0">All Guests</h5>
            <p class="text-muted-soft small mb-0">Everyone registered as a guest of Livinkey.</p>
          </div>
          <div class="table-search">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control" style="width:260px;" id="guestSearch" placeholder="Search by name or nationality">
          </div>
        </div>
        <div class="row g-3" id="guestsGrid"></div>
        <div id="guestsEmpty" class="empty-state d-none">
          <i class="bi bi-person-badge"></i>
          <p class="mb-0 fw-semibold">No guests match your search</p>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Send message modal -->
<div class="modal fade" id="msgModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Message — <span id="msgGuestName"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label">Message</label>
        <textarea class="form-control" id="msgText" rows="6"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-brand" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-brand" id="sendMsgBtn"><i class="bi bi-send me-1"></i>Send message</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit guest modal -->
<div class="modal fade" id="editGuestModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Guest</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="editGuestForm">
        <div class="modal-body">
          <input type="hidden" id="egId">
          <div class="mb-3"><label class="form-label">Full name</label><input class="form-control" id="egName" required></div>
          <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="egEmail" required></div>
          <div class="mb-3"><label class="form-label">Nationality</label><input class="form-control" id="egNationality" required></div>
          <div class="mb-3"><label class="form-label">Phone</label><input class="form-control" id="egPhone" required></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-brand" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand">Save changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Delete confirm -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:56px;height:56px;border-radius:50%;background:var(--danger-bg);">
          <i class="bi bi-exclamation-triangle" style="font-size:1.4rem;color:var(--danger);"></i>
        </div>
        <h5 id="confirmTitle">Delete this guest?</h5>
        <p class="text-muted-soft" id="confirmBody">This action cannot be undone.</p>
        <div class="d-flex justify-content-center gap-2 mt-3">
          <button class="btn btn-outline-brand px-4" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-soft-danger px-4" id="confirmActionBtn">Yes, delete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/guests.js"></script>
</body>
</html>
