<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversations · Livinkey Admin</title>
<link rel="icon" href="assets/img/black_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css?v=2" rel="stylesheet">
<style>
  .conv-layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: calc(100vh - 160px);
    min-height: 480px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
  }
  .conv-list {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  .conv-list-header {
    padding: 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .conv-list-body {
    overflow-y: auto;
    flex: 1;
  }
  .conv-item {
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }
  .conv-item:hover { background: var(--surface); }
  .conv-item.active {
    background: var(--lk-green-100);
    border-left: 3px solid var(--lk-green);
  }
  .conv-item .name { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.15rem; }
  .conv-item .preview {
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conv-item .meta { font-size: 0.7rem; color: var(--muted); margin-top: 0.25rem; }
  .conv-item .badge-unread {
    background: var(--lk-green);
    color: #000;
    font-size: 0.65rem;
    font-weight: 700;
    border-radius: 10px;
    padding: 0.1rem 0.4rem;
  }
  .conv-chat {
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }
  .conv-chat-header {
    padding: 0.9rem 1.2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
  }
  .conv-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    background: #f7f9f4;
  }
  .msg-bubble {
    max-width: 70%;
    padding: 0.7rem 1rem;
    border-radius: 12px;
    font-size: 0.9rem;
    line-height: 1.45;
  }
  .msg-bubble.outbound {
    align-self: flex-end;
    background: var(--lk-green);
    color: #000;
    border-bottom-right-radius: 4px;
  }
  .msg-bubble.inbound {
    align-self: flex-start;
    background: #fff;
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg-bubble .msg-meta {
    font-size: 0.68rem;
    opacity: 0.7;
    margin-top: 0.3rem;
  }
  .msg-bubble.outbound .msg-meta { text-align: right; }
  .conv-chat-input {
    padding: 0.9rem 1.2rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .conv-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
  }
  .conv-empty i { font-size: 3rem; margin-bottom: 0.75rem; opacity: 0.4; }
  @media (max-width: 768px) {
    .conv-layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div id="topbarMount"></div>
    <main class="content-area">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h5 class="mb-0 fw-bold">Conversations</h5>
          <small class="text-muted">WhatsApp & message inbox</small>
        </div>
        <button class="btn btn-sm btn-outline-secondary" id="conv-refresh">
          <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
      </div>

      <div class="conv-layout" id="conv-layout">
        <!-- Left: conversation list -->
        <div class="conv-list">
          <div class="conv-list-header">
            <input type="text" class="form-control form-control-sm" id="conv-search" placeholder="Search name, phone, email...">
          </div>
          <div class="conv-list-body" id="conv-list-body">
            <div class="text-center text-muted py-4">Loading...</div>
          </div>
        </div>

        <!-- Right: chat area -->
        <div class="conv-chat" id="conv-chat">
          <div class="conv-empty" id="conv-empty">
            <i class="bi bi-chat-dots"></i>
            <div>Select a conversation to view messages</div>
          </div>

          <div id="conv-chat-active" style="display:none; flex-direction:column; height:100%;">
            <div class="conv-chat-header">
              <div>
                <div class="fw-bold" id="chat-name">—</div>
                <small class="text-muted" id="chat-meta">—</small>
              </div>
              <button class="btn btn-sm btn-outline-secondary" id="chat-archive" title="Archive">
                <i class="bi bi-archive"></i>
              </button>
            </div>
            <div class="conv-chat-messages" id="chat-messages"></div>
            <div class="conv-chat-input">
              <div class="input-group">
                <input type="text" class="form-control" id="chat-input" placeholder="Type a reply..." autocomplete="off">
                <button class="btn btn-success" id="chat-send">
                  <i class="bi bi-send-fill"></i> Send
                </button>
              </div>
              <small class="text-muted">Replies go via WhatsApp (email fallback if needed)</small>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/conversations.js"></script>
</body>
</html>
