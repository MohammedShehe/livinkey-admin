<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents · Livinkey Admin</title>
<link rel="icon" href="assets/img/white_logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div id="topbarMount"></div>
    <main class="content-area">
      <div class="section-card fade-in">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
          <div>
            <h5 class="mb-0">All Documents</h5>
            <p class="text-muted-soft small mb-0">Manage all tenant documents in one place.</p>
          </div>
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <div class="table-search">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" style="width:220px;" id="docSearch" placeholder="Search by name or room">
            </div>
            <button class="btn btn-outline-brand" id="downloadAllBtn"><i class="bi bi-download me-1"></i>Download All</button>
            <button class="btn btn-soft-danger" id="deleteAllBtn"><i class="bi bi-trash3 me-1"></i>Delete All</button>
          </div>
        </div>
        <div class="row g-3" id="documentsGrid"></div>
        <div id="documentsEmpty" class="empty-state d-none">
          <i class="bi bi-file-earmark"></i>
          <p class="mb-0 fw-semibold">No documents found</p>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Document Preview Modal -->
<div class="modal fade" id="docPreviewModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="docPreviewTitle">Document Preview</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <img id="docPreviewImg" src="" alt="Document" class="img-fluid" style="max-height:500px;">
        <div class="mt-3 d-flex justify-content-center gap-2">
          <button class="btn btn-brand" id="docDownloadBtn"><i class="bi bi-download me-1"></i>Download</button>
          <button class="btn btn-soft-danger" id="docDeleteBtn"><i class="bi bi-trash3 me-1"></i>Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete All Confirm -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:56px;height:56px;border-radius:50%;background:var(--danger-bg);">
          <i class="bi bi-exclamation-triangle" style="font-size:1.4rem;color:var(--danger);"></i>
        </div>
        <h5 id="confirmTitle">Delete all documents?</h5>
        <p class="text-muted-soft" id="confirmBody">This action cannot be undone.</p>
        <div class="d-flex justify-content-center gap-2 mt-3">
          <button class="btn btn-outline-brand px-4" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-soft-danger px-4" id="confirmActionBtn">Yes, delete all</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/documents.js"></script>
</body>
</html>
