<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents · Livinkey Admin</title>
<link rel="icon" href="assets/img/black_logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<style>
  /* Document stats styles */
  .doc-stat-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 0.8rem 1rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .doc-stat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .doc-stat-card.active {
    border-color: var(--lk-green);
    background: var(--lk-green-100);
  }
  .doc-stat-card .doc-stat-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .doc-stat-card .doc-stat-value {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    line-height: 1.2;
    color: var(--lk-black);
  }
  .doc-stat-card .doc-stat-label {
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* Bulk selection styles */
  .bulk-actions {
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 0.5rem 1rem;
    display: none;
    align-items: center;
    gap: 0.8rem;
    flex-wrap: wrap;
    margin-bottom: 0.8rem;
  }
  .bulk-actions.show {
    display: flex;
  }
  .bulk-actions .bulk-count {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }
  
  /* Document card checkbox */
  .doc-card-wrapper {
    position: relative;
  }
  .doc-checkbox {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 5;
    width: 20px;
    height: 20px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .doc-card-wrapper:hover .doc-checkbox,
  .doc-card-wrapper.selected .doc-checkbox {
    opacity: 1;
  }
  .doc-checkbox:checked {
    accent-color: var(--lk-green);
  }
  .doc-card-wrapper.selected .doc-thumb {
    border-color: var(--lk-green);
    box-shadow: 0 0 0 2px var(--lk-green);
  }
  .doc-card-wrapper .doc-thumb {
    transition: all 0.2s ease;
  }
  .doc-card-wrapper:hover .doc-thumb {
    border-color: var(--lk-green);
  }
  
  .select-all-wrapper {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .select-all-wrapper input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--lk-green);
  }

  /* PG Filter styles */
  .pg-filter-wrapper {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .pg-filter-wrapper select {
    min-width: 180px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    padding: 0.4rem 0.8rem;
    font-size: 0.85rem;
    background: var(--surface);
    color: var(--ink);
    font-weight: 500;
    cursor: pointer;
  }
  .pg-filter-wrapper select:focus {
    border-color: var(--lk-green);
    outline: none;
    box-shadow: 0 0 0 3px var(--lk-green-200);
  }
  .pg-filter-wrapper .filter-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  /* Responsive adjustments for documents */
  @media (max-width: 768px) {
    .doc-stat-card {
      padding: 0.6rem 0.8rem;
      gap: 0.5rem;
    }
    .doc-stat-card .doc-stat-icon {
      width: 30px;
      height: 30px;
      font-size: 0.85rem;
    }
    .doc-stat-card .doc-stat-value {
      font-size: 0.95rem;
    }
    .doc-stat-card .doc-stat-label {
      font-size: 0.6rem;
    }
    .bulk-actions {
      padding: 0.4rem 0.8rem;
      gap: 0.5rem;
    }
    .bulk-actions .bulk-count {
      font-size: 0.8rem;
    }
    .pg-filter-wrapper {
      width: 100%;
    }
    .pg-filter-wrapper select {
      min-width: 140px;
      flex: 1;
    }
    .pg-filter-wrapper .filter-label {
      font-size: 0.7rem;
    }
  }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div id="topbarMount"></div>
    <main class="content-area">
      <div class="section-card fade-in">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
          <div>
            <h5 class="mb-0">All Documents</h5>
            <p class="text-muted-soft small mb-0">Manage all tenant documents in one place.</p>
          </div>
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <!-- PG Filter -->
            <div class="pg-filter-wrapper">
              <span class="filter-label"><i class="bi bi-building me-1"></i>PG</span>
              <select id="pgFilter">
                <option value="all">All PGs</option>
              </select>
            </div>
            <div class="table-search">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" style="width:220px;" id="docSearch" placeholder="Search by name or room">
            </div>
          </div>
        </div>

        <!-- Document Stats -->
        <div class="row g-2 mb-3" id="docStats"></div>

        <!-- Bulk Actions -->
        <div class="bulk-actions" id="bulkActions">
          <span class="bulk-count" id="bulkCount">0 selected</span>
          <button class="btn btn-brand btn-sm" id="bulkDownloadBtn"><i class="bi bi-download me-1"></i>Download</button>
          <button class="btn btn-soft-danger btn-sm" id="bulkDeleteBtn"><i class="bi bi-trash3 me-1"></i>Delete</button>
          <button class="btn btn-outline-brand btn-sm" id="bulkClearBtn">Clear</button>
        </div>

        <!-- Select All -->
        <div class="d-flex align-items-center gap-3 mb-2">
          <label class="select-all-wrapper">
            <input type="checkbox" id="selectAllDocs">
            <span>Select All</span>
          </label>
          <span class="text-muted-soft small" id="totalDocsCount">0 documents</span>
        </div>

        <div class="row g-3" id="documentsGrid"></div>
        <div id="documentsEmpty" class="empty-state d-none">
          <i class="bi bi-file-earmark"></i>
          <p class="mb-0 fw-semibold">No documents found</p>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Document Preview Modal -->
<div class="modal fade" id="docPreviewModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="docPreviewTitle">Document Preview</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <img id="docPreviewImg" src="" alt="Document" class="img-fluid" style="max-height:500px;">
        <div class="mt-3 d-flex justify-content-center gap-2">
          <button class="btn btn-brand" id="docDownloadBtn"><i class="bi bi-download me-1"></i>Download</button>
          <button class="btn btn-soft-danger" id="docDeleteBtn"><i class="bi bi-trash3 me-1"></i>Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:56px;height:56px;border-radius:50%;background:var(--danger-bg);">
          <i class="bi bi-exclamation-triangle" style="font-size:1.4rem;color:var(--danger);"></i>
        </div>
        <h5 id="confirmTitle">Delete selected documents?</h5>
        <p class="text-muted-soft" id="confirmBody">This action cannot be undone.</p>
        <div class="d-flex justify-content-center gap-2 mt-3">
          <button class="btn btn-outline-brand px-4" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-soft-danger px-4" id="confirmActionBtn">Yes, delete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/documents.js"></script>
</body>
</html>
