<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages · Livinkey Admin</title>
<link rel="icon" href="assets/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div id="topbarMount"></div>
    <main class="content-area">
      <div class="instr-note mb-3">
        <i class="bi bi-clock-history"></i>
        <div>Messages are automatically deleted after 30 days. You can also delete conversations manually at any time.</div>
      </div>
      <div class="chat-shell fade-in">
        <div class="chat-list">
          <div class="chat-list-header">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h6 class="mb-0">Conversations</h6>
              <button class="btn-icon" title="Start new conversation" data-bs-toggle="modal" data-bs-target="#newChatModal"><i class="bi bi-pencil-square"></i></button>
            </div>
            <div class="table-search">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control form-control-sm" id="chatSearch" placeholder="Search by name or room no">
            </div>
          </div>
          <div class="chat-list-items" id="chatListItems"></div>
        </div>

        <div class="chat-main" id="chatMain">
          <div class="empty-state m-auto">
            <i class="bi bi-chat-square-dots"></i>
            <p class="mb-0 fw-semibold">Select a conversation</p>
            <p class="small">Choose a member from the list to view messages.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- New conversation modal -->
<div class="modal fade" id="newChatModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Start a Conversation</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <label class="form-label">Choose a member</label>
        <select class="form-select" id="newChatSelect"></select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-brand" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-brand" id="startChatBtn">Start chat</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete chats modal -->
<div class="modal fade" id="deleteChatModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Delete Messages</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="d-grid gap-2 mb-3">
          <button class="btn btn-outline-brand" id="selectModeBtn"><i class="bi bi-check2-square me-1"></i>Select specific messages to delete</button>
          <button class="btn btn-soft-danger" id="deleteAllBtn"><i class="bi bi-trash3 me-1"></i>Delete entire conversation</button>
        </div>
        <div id="selectMsgsWrap" class="d-none">
          <p class="small text-muted-soft">Choose messages, then confirm below.</p>
          <div id="selectMsgsList" style="max-height:260px;overflow-y:auto;"></div>
          <button class="btn btn-soft-danger w-100 mt-3" id="deleteSelectedBtn">Delete selected</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/messages.js"></script>
</body>
</html>
