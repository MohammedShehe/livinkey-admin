<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooms · Livinkey Admin</title>
<link rel="icon" href="assets/img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div id="topbarMount"></div>
    <main class="content-area">
      <div class="row g-3 mb-4" id="roomStats"></div>

      <div class="section-card fade-in">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
          <div>
            <h5 class="mb-0">All Rooms</h5>
            <p class="text-muted-soft small mb-0">Occupancy and rent overview for every room.</p>
          </div>
          <div class="d-flex align-items-center gap-2">
            <div class="table-search">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" style="width:220px;" id="roomSearch" placeholder="Search by room no or floor">
            </div>
            <button class="btn-fab" data-bs-toggle="modal" data-bs-target="#addRoomModal" title="Add room"><i class="bi bi-plus-lg"></i></button>
          </div>
        </div>
        <div class="row g-3" id="roomsGrid"></div>
      </div>
    </main>
  </div>
</div>

<div class="modal fade" id="addRoomModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="roomModalTitle">Add Room</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="roomForm">
        <div class="modal-body">
          <input type="hidden" id="roomId">
          <div class="row g-3">
            <div class="col-6"><label class="form-label">Room no.</label><input class="form-control" id="rNo" required></div>
            <div class="col-6"><label class="form-label">Floor</label><input class="form-control" id="rFloor" required></div>
            <div class="col-6"><label class="form-label">Capacity</label><input type="number" min="1" class="form-control" id="rCapacity" required></div>
            <div class="col-6"><label class="form-label">Rent (INR)</label><input type="number" class="form-control" id="rRent" required></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-brand" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand">Save room</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:56px;height:56px;border-radius:50%;background:var(--danger-bg);">
          <i class="bi bi-exclamation-triangle" style="font-size:1.4rem;color:var(--danger);"></i>
        </div>
        <h5 id="confirmTitle">Delete this room?</h5>
        <p class="text-muted-soft" id="confirmBody">This action cannot be undone.</p>
        <div class="d-flex justify-content-center gap-2 mt-3">
          <button class="btn btn-outline-brand px-4" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-soft-danger px-4" id="confirmActionBtn">Yes, delete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/rooms.js"></script>
</body>
</html>
