<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenant Archive · Livinkey Admin</title>
<link rel="icon" href="assets/img/black_logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div id="appLayout"></div>

<div class="page-content" id="pageContent" style="display:none;">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <div>
      <h4 class="mb-0">Tenant Archive</h4>
      <p class="text-muted-soft small mb-0">Checked-out and archived tenants. Restore or permanently delete.</p>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-outline-brand btn-sm" id="btnRestoreSelected" disabled>
        <i class="bi bi-arrow-counterclockwise me-1"></i> Restore selected
      </button>
      <button class="btn btn-soft-danger btn-sm" id="btnPermDeleteSelected" disabled>
        <i class="bi bi-trash3 me-1"></i> Permanent delete
      </button>
    </div>
  </div>

  <div class="row g-3 mb-3" id="archiveStats">
    <div class="col-6 col-md-3">
      <div class="stat-card"><div class="stat-label">Active</div><div class="stat-value" id="statActive">—</div></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card"><div class="stat-label">Checked out</div><div class="stat-value" id="statCheckedOut">—</div></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card"><div class="stat-label">Archived</div><div class="stat-value" id="statArchived">—</div></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card"><div class="stat-label">All (active + inactive)</div><div class="stat-value" id="statAll">—</div></div>
    </div>
  </div>

  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-md-3">
          <label class="form-label small">Search</label>
          <input type="search" class="form-control form-control-sm" id="filterSearch" placeholder="Name, email, phone, room…">
        </div>
        <div class="col-md-2">
          <label class="form-label small">Status</label>
          <select class="form-select form-select-sm" id="filterStatus">
            <option value="">All inactive</option>
            <option value="checked_out">Checked out</option>
            <option value="archived">Archived</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label small">Gender</label>
          <select class="form-select form-select-sm" id="filterGender">
            <option value="">All</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label small">Residency</label>
          <select class="form-select form-select-sm" id="filterResidency">
            <option value="">All</option>
            <option value="national">National</option>
            <option value="international">International</option>
          </select>
        </div>
        <div class="col-md-1">
          <label class="form-label small">Year</label>
          <select class="form-select form-select-sm" id="filterYear">
            <option value="">All</option>
          </select>
        </div>
        <div class="col-md-1">
          <label class="form-label small">Month</label>
          <select class="form-select form-select-sm" id="filterMonth">
            <option value="">All</option>
            <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
            <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
            <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
            <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
          </select>
        </div>
        <div class="col-md-1">
          <button class="btn btn-brand btn-sm w-100" id="btnApplyFilters">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th style="width:36px"><input type="checkbox" id="selectAll" title="Select all"></th>
            <th>Tenant</th>
            <th>PG / Room</th>
            <th>Arrival</th>
            <th>Checkout / Archived</th>
            <th>Status</th>
            <th>Reason</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="archiveTableBody">
          <tr><td colspan="8" class="text-center text-muted py-4">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:56px;height:56px;border-radius:50%;background:var(--danger-bg);">
          <i class="bi bi-exclamation-triangle" style="font-size:1.4rem;color:var(--danger);"></i>
        </div>
        <h5 id="confirmTitle">Confirm</h5>
        <p class="text-muted-soft" id="confirmBody"></p>
        <div class="d-flex justify-content-center gap-2 mt-3">
          <button class="btn btn-outline-brand px-4" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-soft-danger px-4" id="confirmActionBtn">Confirm</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/archive.js"></script>
</body>
</html>
